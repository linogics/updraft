services:
  # Development: hot reload on http://localhost:5173
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    environment:
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cesium_static:/app/static/cesium

  # Production image: Caddy on http://localhost:8080
  web:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
    profiles: ["prod"]

volumes:
  node_modules:
  cesium_static:
