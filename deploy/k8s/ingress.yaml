apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paragliding-replay
spec:
  # Adjust class and host to your cluster.
  ingressClassName: nginx
  rules:
    - host: paragliding.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paragliding-replay
                port:
                  name: http
