apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Point at your registry, e.g.:
#   kustomize edit set image paragliding-replay=ghcr.io/<owner>/paragliding-replay:<tag>
images:
  - name: paragliding-replay
    newTag: latest
