apiVersion: apps/v1
kind: Deployment
metadata:
  name: paragliding-replay
  labels:
    app.kubernetes.io/name: paragliding-replay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paragliding-replay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paragliding-replay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: paragliding-replay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Optional: without a token the app falls back to a flat OSM globe.
            - name: CESIUM_ION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paragliding-replay
                  key: cesium-ion-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx renders /etc/nginx/templates into conf.d at start-up and needs /tmp for pid and caches.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
