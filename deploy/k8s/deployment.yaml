apiVersion: apps/v1
kind: Deployment
metadata:
  name: paragliding-replay
  labels:
    app.kubernetes.io/name: paragliding-replay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paragliding-replay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paragliding-replay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: paragliding-replay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Optional: without a token the app falls back to a flat OSM globe.
            - name: CESIUM_ION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paragliding-replay
                  key: cesium-ion-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Caddy's data/config dirs (XDG_*) and /tmp must be writable with a read-only root filesystem.
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
