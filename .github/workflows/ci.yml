name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run docs:services && test -z "$(git status --porcelain docs/services)"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t updraft-server server
      - name: Smoke test
        run: |
          docker run -d --name pb -p 8090:8090 \
            -v "$PWD/server/pb_migrations:/pb/pb_migrations" \
            -v "$PWD/server/pb_hooks:/pb/pb_hooks" updraft-server
          for i in $(seq 30); do curl -fsS http://localhost:8090/api/health && break; sleep 1; done
          curl -fsS http://localhost:8090/api/health
          # The push route is mounted if it answers 401 instead of 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8090/api/updraft/push)
          test "$code" = 401
      - name: Server logs
        if: failure()
        run: docker logs pb
