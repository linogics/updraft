# Sync server for updraft. Start it with: docker compose -f server/compose.yaml up -d --build
# This listens on localhost port 8090 only (plain HTTP). Put a reverse proxy with HTTPS on the same host in front of it, the app needs HTTPS in production.
services:
  pocketbase:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Set to true to let anyone create an account through POST /api/updraft/v1/auth/signup.
      UPDRAFT_SIGNUP: ${UPDRAFT_SIGNUP:-false}
      # OAuth sign in for the v1 popup flow. Both must be set, or it stays off.
      # Comma separated app origins that may receive the token, exact match, for example https://updraft.example.org.
      UPDRAFT_APP_ORIGINS: ${UPDRAFT_APP_ORIGINS:-}
      # The public https address of this server. The provider redirects back to <this>/api/updraft/v1/auth/callback, so register that URL there.
      UPDRAFT_PUBLIC_URL: ${UPDRAFT_PUBLIC_URL:-}
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks

volumes:
  pb_data:
