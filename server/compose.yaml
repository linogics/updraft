# Sync server for updraft. Start it with: docker compose -f server/compose.yaml up -d --build
# This listens on localhost port 8090 only (plain HTTP). Put a reverse proxy with HTTPS on the same host in front of it, the app needs HTTPS in production.
services:
  pocketbase:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Set to true to let anyone create an account through POST /api/updraft/v1/auth/signup.
      UPDRAFT_SIGNUP: ${UPDRAFT_SIGNUP:-false}
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks

volumes:
  pb_data:
