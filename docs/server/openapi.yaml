openapi: 3.1.0
info:
  title: Updraft sync HTTP spec
  version: '2'
  description: |
    The HTTP interface between the Updraft app and a sync server. Any server that implements it can be used as a backend.
    The guide with the reasons is `docs/server/README.md`.

    All routes live under the base path `/api/updraft/v2`. Errors are JSON with at least a `message` string.

    The server stores three collections per account: `flights`, `camera-paths` and `prefs`. Every item has an opaque
    `version` that changes on every write. Writes are conditional (`If-Match`, `If-None-Match`), so two devices can
    never overwrite each other silently. The server never merges. On a conflict it answers 412 with the current item
    and the client merges field by field with the `times` map.

    Club creation, membership, roles and account self service are server business and are not part of this spec.
servers:
  - url: /api/updraft/v2
security:
  - bearer: []
paths:
  /:
    get:
      operationId: getCapabilities
      summary: Capabilities
      description: Tells the client what this server supports. Needs no token. The client calls it first.
      security: []
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /auth/password:
    post:
      operationId: signInWithPassword
      summary: Sign in with a password
      description: Only available when `auth.password` is true. Servers should rate limit this route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/signup:
    post:
      operationId: signUp
      summary: Create an account
      description: Only available when `auth.signup` is true, otherwise the server answers 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          description: The email is invalid or taken, or the password is shorter than 8 characters.
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/redirect/{provider}:
    get:
      operationId: oauthRedirect
      summary: Start an OAuth sign in
      description: |
        Only for providers listed in `auth.oauth`. The app opens this URL in a popup. The server checks `origin` against
        its allow list of exact app origins, saves the sign in state in a short lived cookie on the server's own path
        `/api/updraft/v2/auth` and redirects (302) to the provider. The provider returns to `GET /auth/callback`.
        Servers should rate limit this route.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: An `id` from `auth.oauth`.
          schema:
            type: string
        - name: origin
          in: query
          required: true
          description: The origin of the app, for example `https://updraft.example.org`. Must match an allowed origin exactly.
          schema:
            type: string
        - name: app_state
          in: query
          required: true
          description: A random value the app made for this sign in, at least 22 base64url characters. The server echoes it as `state` in the result, so the app can ignore any result that is not its own.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,128}$'
      responses:
        '302':
          description: Redirect to the provider's sign in page.
        '400':
          description: The origin is not allowed, or `app_state` is missing or malformed.
          $ref: '#/components/responses/Error'
        '404':
          description: The provider is not offered.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/callback:
    get:
      operationId: oauthCallback
      summary: Finish an OAuth sign in
      description: |
        Where the provider redirects the popup to. Not called by the app directly. The server checks `state` against the
        cookie, exchanges `code`, and matches the provider account to a server account: first by an earlier link, then
        by the same email, which it then links. When nothing matches it creates an account only if `auth.signup` is true,
        otherwise the sign in fails with the message `No account matches your <provider label> email. Ask the server admin to create one with that email.`

        The answer is a redirect (302) to `<origin>/oauth-callback.html#<result>` with `Referrer-Policy: no-referrer` and
        `Cache-Control: no-store`. `origin` is the allowed app origin saved in the cookie, never anything from the
        query. `<result>` is `encodeURIComponent(JSON.stringify(message))`, in the fragment so no server or proxy sees
        it. The app page reads it, removes the fragment from the address bar and hands it to the app tab. It does not
        use `window.opener`, because providers send `Cross-Origin-Opener-Policy` and cut it. `message` is one of:

        - `{ "type": "updraft-auth", "state": "...", "token": "...", "user": { "id": "...", "name": "..." } }`, the same session as a password sign in.
        - `{ "type": "updraft-auth", "state": "...", "error": "..." }`, with a message that is safe to show.

        `state` is the `app_state` of the start request. The app must ignore a result with another value.

        When the cookie is missing, expired or does not match `state`, there is no trusted origin, so the server answers 400
        with a plain page and no redirect.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the app with the result in the fragment.
        '400':
          description: No valid sign in was started in this browser.
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /{collection}:
    get:
      operationId: listChanges
      summary: Catch up on a collection
      description: |
        Returns the items of the signed in account that changed after `since`, in a stable server order, deleted
        items as tombstones. Items carry `data` and `times` but never track bytes. Keep calling with the returned
        `cursor` while `more` is true. Without `since` the feed starts at the beginning.

        An empty page returns the sent cursor, or `null` when none was sent. `more` is true when the page is full.
        A malformed cursor, a cursor the server does not know and a bad `limit` answer 400. After a 400 on a stored
        cursor the client starts again from the beginning.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          description: Bad cursor or limit.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /{collection}/{id}:
    parameters:
      - $ref: '#/components/parameters/Collection'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getItem
      summary: Fetch one item
      description: The `ETag` header is the item version in double quotes. A deleted item answers 200 with the tombstone.
      responses:
        '200':
          description: The item.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: The item never existed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putItem
      summary: Create or update an item
      description: |
        Create needs `If-None-Match: *`. Update needs `If-Match` with the current version. A request with neither
        answers 428. When the version does not match, or the item exists on create, the server answers 412 with the
        current item. An `If-Match` on an item that never existed answers 404.
        Writing a tombstone with `If-Match` on the tombstone version revives it.

        The server stores `data` and `times` as is. It reads only the known fields of `flights`, see `FlightData`.
        `secret` is for `prefs`. The client sets it on `cesiumIonToken` and `openaipKey` after the pilot opted in to
        syncing them. A server must keep such items out of its logs and out of every other route.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemWrite'
      responses:
        '200':
          description: Stored. The body is the stored item.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The body is not a valid `ItemWrite`.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: '`If-Match` was sent for an item that never existed.'
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/Error'
        '428':
          description: Neither `If-Match` nor `If-None-Match` was sent.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteItem
      summary: Delete an item
      description: |
        Needs `If-Match`. The server keeps a tombstone that shows in the feed, so other devices learn about the
        delete. Deleting a flight also deletes its tracks.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: The item never existed.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Conflict'
        '428':
          description: '`If-Match` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /flights/{id}/track:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTrack
      summary: Fetch the original track file
      description: Answers the bytes with the `Content-Type` they were stored with.
      responses:
        '200':
          description: The file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: There is no such flight or it has no track.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putTrack
      summary: Upload the original track file
      description: |
        The raw bytes of the file the pilot imported (IGC, GPX, FIT, KML and more), with any `Content-Type`.
        The server stores and serves it back as is and never parses it. A track is written once and is immutable.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatchRequired'
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: The flight does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '412':
          description: The track is already there.
          $ref: '#/components/responses/Error'
        '413':
          description: The file is larger than `limits.maxTrackBytes`.
          $ref: '#/components/responses/Error'
        '428':
          description: '`If-None-Match: *` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /flights/{id}/track.json:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTrackJson
      summary: Fetch the parsed track
      responses:
        '200':
          description: The parsed fixes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackJson'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: There is no such flight or it has no parsed track.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putTrackJson
      summary: Upload the parsed track
      description: |
        The fixes the app parsed from the original file. It saves other devices the work of parsing. The server
        stores it as is and never looks inside. A parsed track is written once and is immutable.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackJson'
      responses:
        '201':
          description: Stored.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: The flight does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '412':
          description: The parsed track is already there.
          $ref: '#/components/responses/Error'
        '413':
          description: The body is larger than `limits.maxTrackBytes`.
          $ref: '#/components/responses/Error'
        '428':
          description: '`If-None-Match: *` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs:
    get:
      operationId: listClubs
      summary: List my clubs
      description: Only available when `clubs` is true, otherwise the server answers 403 or 404.
      responses:
        '200':
          description: The clubs the signed in pilot belongs to.
          content:
            application/json:
              schema:
                type: object
                required: [clubs]
                properties:
                  clubs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights:
    get:
      operationId: listClubFlights
      summary: Catch up on the flights of a club
      description: |
        The flights shared with the club, with the same cursor rules as the collection feed. An unshare, a delete
        and a member who left show as `deleted: true`, so the client can drop them. A club flight carries a summary
        and never the flight data. The pilot must be a member, otherwise the answer is 404, the same as for an
        unknown club.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubFlightPage'
        '400':
          description: Bad cursor or limit.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Clubs are off.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown club, or the pilot is not a member.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights/{key}/track:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/Key'
    get:
      operationId: getClubTrack
      summary: Fetch the original track file of a club flight
      responses:
        '200':
          description: The file, with the `Content-Type` it was stored with.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown, unshared or deleted flight, or the pilot is not a member. All look the same.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights/{key}/track.json:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/Key'
    get:
      operationId: getClubTrackJson
      summary: Fetch the parsed track of a club flight
      responses:
        '200':
          description: The parsed fixes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackJson'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown, unshared or deleted flight, or the pilot is not a member. All look the same.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` from a sign in, sent as `Authorization Bearer`.
  parameters:
    Collection:
      name: collection
      in: path
      required: true
      description: One of the collections the server stores per account.
      schema:
        enum: [flights, camera-paths, prefs]
    Id:
      name: id
      in: path
      required: true
      description: The item id, 1 to 200 characters. For `prefs` it is the pref key.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ClubId:
      name: clubId
      in: path
      required: true
      schema:
        type: string
    Key:
      name: key
      in: path
      required: true
      description: The opaque `key` of a club flight.
      schema:
        type: string
    Since:
      name: since
      in: query
      description: The `cursor` of the previous page. Absent starts from the beginning.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size, 1 to `limits.maxPage`. Defaults to `limits.maxPage`.
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      description: The current item version in double quotes, as the `ETag` header shows it.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The value `*` creates the item and fails when it exists.
      schema:
        type: string
    IfNoneMatchRequired:
      name: If-None-Match
      in: header
      required: true
      description: Must be `*`.
      schema:
        const: '*'
  headers:
    ETag:
      description: The item version in double quotes.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the next try.
      schema:
        type: integer
  responses:
    Error:
      description: An error. The body has at least `message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The version does not match, or the item exists on create. The body is the current item.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    RateLimited:
      description: Too many requests. Servers may also send `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The server is busy. Try again later.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Session:
      description: Signed in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
  schemas:
    PasswordLogin:
      type: object
      required: [identity, password]
      properties:
        identity:
          type: string
          description: The email of the account.
        password:
          type: string
    SignUp:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: At least 8 characters.
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
              description: A label for the account, such as the email.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: true
    Capabilities:
      type: object
      required: [version, auth, clubs, limits]
      properties:
        version:
          const: 2
        auth:
          type: object
          required: [password, signup, oauth]
          properties:
            password:
              type: boolean
            signup:
              type: boolean
            oauth:
              type: array
              description: Providers for the popup sign in. An empty array when the server offers none.
              items:
                type: object
                required: [id, label]
                properties:
                  id:
                    type: string
                    description: Pass it as `{provider}` to `GET /auth/redirect/{provider}`.
                  label:
                    type: string
                    description: Display name for the sign in button.
        clubs:
          type: boolean
          description: True when the club routes work.
        limits:
          type: object
          required: [maxPage, maxItemBytes, maxTrackBytes]
          properties:
            maxPage:
              type: integer
              description: Largest page of a feed.
            maxItemBytes:
              type: integer
              description: Largest body of an item write.
            maxTrackBytes:
              type: integer
              description: Largest body of a track upload.
    Item:
      type: object
      required: [id, version, deleted]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          description: Opaque. Changes on every write, also on a delete. It is the value of the `ETag` header without quotes.
        deleted:
          type: boolean
          description: True for a tombstone.
        data:
          type: object
          description: The record, opaque to the server. Absent on a tombstone.
        times:
          $ref: '#/components/schemas/Times'
        secret:
          type: boolean
          description: Only on `prefs`. True when the value is a secret, such as an API key.
    Times:
      type: object
      description: Maps a top level field of `data` to the client clock in milliseconds when it last changed. Absent on a tombstone.
      additionalProperties:
        type: number
    ItemWrite:
      type: object
      required: [data, times]
      properties:
        data:
          type: object
        times:
          $ref: '#/components/schemas/Times'
        secret:
          type: boolean
          description: Only for `prefs`. Marks the item as a secret.
    ItemPage:
      type: object
      required: [items, cursor, more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        cursor:
          description: Opaque. Send it back as `since`. On an empty page it is the cursor that was sent, or null when none was.
          anyOf:
            - type: string
            - type: 'null'
        more:
          type: boolean
          description: True when the page was full, so there may be more items.
    FlightData:
      type: object
      description: The fields of a `flights` item that the server reads. Every other field is opaque. Not enforced on write.
      properties:
        clubs:
          type: array
          description: Ids of the clubs the flight is shared with.
          items:
            type: string
        club:
          type: object
          description: Opaque summary shown in club feeds, for example `{ km }`.
        hasTrack:
          type: boolean
          description: False for a manual logbook flight without a track.
    TrackJson:
      type: object
      required: [fixes]
      description: The parsed fixes. The server never looks inside.
      properties:
        fixes:
          type: array
          items:
            type: object
            description: A fix with `t` (ms), `lat`, `lon` and `alt`.
    Club:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ClubFlight:
      type: object
      required: [key, owner, mine, version, deleted, hasTrack]
      properties:
        key:
          type: string
          description: Opaque id for the track routes. It is not the id of the owner's item.
        owner:
          type: string
          description: Opaque account id. The app groups the flights of one pilot by it.
        mine:
          type: boolean
          description: True when the signed in account owns the flight.
        version:
          type: string
          description: Opaque. Changes whenever the entry changes.
        deleted:
          type: boolean
          description: True after an unshare, a delete or when the owner left the club.
        summary:
          description: The `club` field of the flight data, or null. Absent when deleted.
          anyOf:
            - type: object
            - type: 'null'
        hasTrack:
          type: boolean
    ClubFlightPage:
      type: object
      required: [items, cursor, more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClubFlight'
        cursor:
          description: Opaque. Send it back as `since`. On an empty page it is the cursor that was sent, or null when none was.
          anyOf:
            - type: string
            - type: 'null'
        more:
          type: boolean
