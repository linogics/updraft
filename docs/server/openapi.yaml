openapi: 3.1.0
info:
  title: Updraft sync HTTP spec
  version: '2'
  description: |
    The HTTP interface between the Updraft app and a sync server. Any server that implements it can be used as a backend.

    The server stores three collections per account: `flights`, `camera-paths` and `prefs`. Every item has an opaque
    `version` that changes on every write. Writes are conditional (`If-Match`, `If-None-Match`), so two devices can
    never overwrite each other silently. The server never merges. On a conflict it answers 412 with the current item
    and the client merges field by field with the `times` map.

    Club creation, membership, roles and account self service are server business and are not part of this spec.

    ## Global rules

    - **Base path.** All routes live under `/api/updraft/v2`. The client takes the server address a user enters, for
      example `https://sync.example.com`, and adds the base path. The spec version is `2`.
    - **Auth.** Every route needs the header `Authorization: Bearer <token>`, except the routes that say "No token
      needed". The token is opaque. It comes from a sign in answer, see `Session`.
    - **Bodies.** Everything is JSON, except track files.
    - **Errors.** An error is a status code and a JSON body `{ "message": "..." }`. Extra fields are ignored. The app
      shows `message` as is, so keep it short and safe to show.
    - **Capabilities.** The client calls `GET /` first and only uses what the server announces. A route whose
      capability is off answers 403 or 404.
    - **Size limits.** Answer 413 for a body over `limits.maxItemBytes` or `limits.maxTrackBytes`. Check the size
      before you read the whole body.
    - **Rate limits.** Rate limit the auth routes, they are open to the internet. Answer 429 or 503 with a
      `Retry-After` header in seconds, the client waits and tries again. A server may also send `RateLimit-Limit`,
      `RateLimit-Remaining` and `RateLimit-Reset`.
    - **CORS.** The client is a web page on another origin. CORS must allow the app origin and the request headers
      `Authorization`, `If-Match`, `If-None-Match` and `Content-Type`, and expose the response headers `ETag` and
      `Retry-After`.
    - **Sign in.** A useful server offers at least one way to sign in: password or an OAuth provider.
tags:
  - name: Meta
    description: What the server supports. The client reads it first.
  - name: Auth
    description: Sign in with a password or through an OAuth popup, and create an account.
  - name: Items
    description: The three collections of an account, with a catch-up feed and conditional writes.
  - name: Tracks
    description: Track files of a flight. Each file is written once.
  - name: Clubs
    description: Read only access to the flights shared with a club.
servers:
  - url: /api/updraft/v2
security:
  - bearer: []
paths:
  /:
    get:
      operationId: getCapabilities
      tags: [Meta]
      summary: Capabilities
      description: |
        Tells the client what this server supports. The client calls it first and only uses what the server announces.
        A server needs at least one way to sign in, `auth.password` or an entry in `auth.oauth`.
      security: []
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /auth/password:
    post:
      operationId: signInWithPassword
      tags: [Auth]
      summary: Sign in with a password
      description: |
        Only available when `auth.password` is true. Servers must rate limit this route.
        `identity` is the email of the account. Answer an unknown email exactly like a wrong password, so nobody can
        learn which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          description: A field is missing.
          $ref: '#/components/responses/Error'
        '401':
          description: The email or the password is wrong.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/signup:
    post:
      operationId: signUp
      tags: [Auth]
      summary: Create an account
      description: |
        Only available when `auth.signup` is true, otherwise the server answers 403. Servers must rate limit this route.
        The password needs at least 8 characters.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          description: The email is invalid or taken, or the password is shorter than 8 characters.
          $ref: '#/components/responses/Error'
        '403':
          description: Sign up is off.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/redirect/{provider}:
    get:
      operationId: oauthRedirect
      tags: [Auth]
      summary: Start an OAuth sign in
      description: |
        Only for providers listed in `auth.oauth`. The app opens this URL in a popup. Servers must rate limit this route.

        1. The server checks `origin` against its allow list of exact app origins and `app_state` against
           `^[A-Za-z0-9_-]{22,128}$`. It answers 400 for either and 404 for an unknown provider.
        2. The server makes its own random `state` and a PKCE verifier. It saves `state`, the verifier, `origin`,
           `app_state` and the provider in a cookie. The cookie has path `/api/updraft/v2/auth`, `HttpOnly`,
           `SameSite=Lax`, `Secure` on https and a lifetime of 10 minutes. `Lax` is needed so the cookie comes back
           on the provider's redirect.
        3. The server redirects (302) to the provider with `state` and a PKCE challenge (method `S256`).

        The redirect URL registered at the provider is `<public url>/api/updraft/v2/auth/callback`. The public url is
        configured on the server and never read from the request, so a forged `Host` header cannot steer the redirect.
        The provider then returns to `GET /auth/callback`.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: An `id` from `auth.oauth`.
          schema:
            type: string
        - name: origin
          in: query
          required: true
          description: The origin of the app, for example `https://updraft.example.org`. Must match an allowed origin exactly.
          schema:
            type: string
        - name: app_state
          in: query
          required: true
          description: A random value the app made for this sign in, 22 to 128 base64url characters. The server echoes it as `state` in the result, so the app can ignore any result that is not its own.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,128}$'
      responses:
        '302':
          description: Redirect to the provider's sign in page.
        '400':
          description: The origin is not allowed, or `app_state` is missing or malformed.
          $ref: '#/components/responses/Error'
        '404':
          description: The provider is not offered.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/callback:
    get:
      operationId: oauthCallback
      tags: [Auth]
      summary: Finish an OAuth sign in
      description: |
        Where the provider redirects the popup to. Not called by the app directly. Servers must rate limit this route.

        1. The server reads the cookie and deletes it, then compares `state`. When the cookie is missing, expired or
           does not match, there is no trusted origin. Answer 400 with a plain page and do not redirect.
        2. The server exchanges `code` for a token with the PKCE verifier and fetches the provider account.
        3. The server matches a server account, first by an earlier link of that provider account, then by the same
           email, which it then links. When nothing matches it creates an account only if `auth.signup` is true.
           Otherwise the sign in fails with the message `No account matches your <provider label> email. Ask the server admin to create one with that email.`
        4. The server redirects (302) to `<origin>/oauth-callback.html#<result>` with `Referrer-Policy: no-referrer`
           and `Cache-Control: no-store`. `origin` is the allowed app origin saved in the cookie, never anything from
           the query. `<result>` is `encodeURIComponent(JSON.stringify(message))`. It is in the fragment so no server,
           proxy or log sees the token.

        `message` is one of:

        - `{ "type": "updraft-auth", "state": "...", "token": "...", "user": { "id": "...", "name": "..." } }`, the same session as a password sign in.
        - `{ "type": "updraft-auth", "state": "...", "error": "..." }`, with a message that is safe to show.

        `state` is the `app_state` of the start request. The app accepts a message only if `type` is `updraft-auth` and
        `state` equals its own `app_state`.

        The page `/oauth-callback.html` ships with the app. It reads the fragment, removes it from the address bar,
        posts the message on a `BroadcastChannel` named `updraft-auth` and closes the popup. It does not use
        `window.opener`, because providers send `Cross-Origin-Opener-Policy` headers that cut it.
      security: []
      parameters:
        - name: code
          in: query
          description: The authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          description: The `state` the server sent to the provider.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the app with the result in the fragment.
          headers:
            Referrer-Policy:
              description: Always `no-referrer`.
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
        '400':
          description: No valid sign in was started in this browser. The body is a plain page.
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /{collection}:
    get:
      operationId: listChanges
      tags: [Items]
      summary: Catch up on a collection
      description: |
        Returns the items of the signed in account that changed after `since`, in a stable server order, deleted
        items as tombstones. Items carry `data` and `times` but never track bytes. The cursor is an opaque string.
        The client stores it and sends it back as `since`. Keep calling with the returned `cursor` while `more` is
        true. Without `since` the feed starts at the beginning.

        An empty page returns the sent cursor, or `null` when none was sent. `more` is true when the page is full.
        `limit` is 1 to `limits.maxPage` and defaults to `limits.maxPage`.

        A malformed cursor, a cursor the server does not know and a bad `limit` all answer 400. After a 400 on a stored
        cursor the client starts again from the beginning, so a server may change its cursor format or lose its
        history. Use cursors, never offsets. A cursor stays correct while items are written, and a server can answer
        it with an index seek.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          description: Bad cursor or limit.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /{collection}/{id}:
    parameters:
      - $ref: '#/components/parameters/Collection'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getItem
      tags: [Items]
      summary: Fetch one item
      description: |
        The `ETag` header is the item version in double quotes. It answers 404 only when the item never existed.
        A deleted item answers 200 with the tombstone, which has no `data` and no `times`.
      responses:
        '200':
          description: The item.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The item never existed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putItem
      tags: [Items]
      summary: Create or update an item
      description: |
        Create needs `If-None-Match: *`. It fails with 412 when the item exists, also as a tombstone. Update needs
        `If-Match` with the current version. It fails with 412 when the version is not the current one. A request with
        neither header answers 428. An `If-Match` on an item that never existed answers 404. The 412 body is the
        current item, so the client does not need another request. Writing a tombstone with `If-Match` on the
        tombstone version revives the item.

        The server stores `data` and `times` as is. It reads only the known fields of `flights`, see `FlightData`.
        Manual logbook flights live in `flights` too.

        `secret` is for `prefs`. The client sets it on `cesiumIonToken` and `openaipKey`, and only after the pilot
        opted in to syncing them. A server must keep such items out of its logs and never expose them in another
        route, for example a club feed or an admin export.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemWrite'
      responses:
        '200':
          description: Stored. The body is the stored item.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The body is not a valid `ItemWrite`.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`If-Match` was sent for an item that never existed.'
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Conflict'
        '413':
          description: The body is larger than `limits.maxItemBytes`.
          $ref: '#/components/responses/Error'
        '428':
          description: Neither `If-Match` nor `If-None-Match` was sent.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Delete an item
      description: |
        Needs `If-Match` with the current version. The server keeps a tombstone that shows in the feed, so other
        devices learn about the delete. The tombstone has a new version, no `data` and no `times`. Deleting a flight
        also deletes its tracks.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted. The tombstone stays.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The item never existed.
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Conflict'
        '428':
          description: '`If-Match` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /flights/{id}/track:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTrack
      tags: [Tracks]
      summary: Fetch the original track file
      description: Answers the bytes with the `Content-Type` they were stored with. A deleted flight has no tracks.
      responses:
        '200':
          description: The file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: There is no such flight or it has no track.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putTrack
      tags: [Tracks]
      summary: Upload the original track file
      description: |
        The raw bytes of the file the pilot imported (IGC, GPX, FIT, KML and more), with any `Content-Type`.
        The server stores and serves it back with that type, and never parses it. A track is written once and is
        immutable. A second upload answers 412 and a missing `If-None-Match: *` answers 428. The flight item must
        exist and not be deleted, otherwise 404. A body over `limits.maxTrackBytes` answers 413.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatchRequired'
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored. The track is now immutable.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The flight does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '412':
          description: The track is already there.
          $ref: '#/components/responses/Error'
        '413':
          description: The file is larger than `limits.maxTrackBytes`.
          $ref: '#/components/responses/Error'
        '428':
          description: '`If-None-Match: *` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /flights/{id}/track.json:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTrackJson
      tags: [Tracks]
      summary: Fetch the parsed track
      responses:
        '200':
          description: The parsed fixes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: There is no such flight or it has no parsed track.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putTrackJson
      tags: [Tracks]
      summary: Upload the parsed track
      description: |
        The fixes the app parsed from the original file. It saves other devices the work of parsing. The server
        stores it as is and never looks inside. A parsed track is written once and is immutable. A second upload
        answers 412 and a missing `If-None-Match: *` answers 428. The flight item must exist and not be deleted,
        otherwise 404. A body over `limits.maxTrackBytes` answers 413.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackJson'
      responses:
        '201':
          description: Stored. The track is now immutable.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The flight does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '412':
          description: The parsed track is already there.
          $ref: '#/components/responses/Error'
        '413':
          description: The body is larger than `limits.maxTrackBytes`.
          $ref: '#/components/responses/Error'
        '428':
          description: '`If-None-Match: *` was not sent.'
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs:
    get:
      operationId: listClubs
      tags: [Clubs]
      summary: List my clubs
      description: |
        Only available when `clubs` is true, otherwise the server answers 403 or 404. Creating clubs and managing
        members is the server's business, the app only reads.
      responses:
        '200':
          description: The clubs the signed in pilot belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Clubs are off.
          $ref: '#/components/responses/Error'
        '404':
          description: Clubs are off.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights:
    get:
      operationId: listClubFlights
      tags: [Clubs]
      summary: Catch up on the flights of a club
      description: |
        The flights shared with the club, with the same cursor rules as the collection feed. A flight is shared with a
        club when its `data.clubs` lists the club id. The server keeps the club id and the `data.club` summary next to
        the flight, so a club feed never has to load the heavy `data`. An unshare, a delete and a member who left show
        as `deleted: true`, so the client can drop them. The pilot must be a member, otherwise the answer is 404, the
        same 404 as for an unknown club, an unknown, unshared or deleted flight. All cases must look the same, so
        nobody learns what exists.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubFlightPage'
        '400':
          description: Bad cursor or limit.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Clubs are off.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown club, or the pilot is not a member.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights/{key}/track:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/Key'
    get:
      operationId: getClubTrack
      tags: [Clubs]
      summary: Fetch the original track file of a club flight
      responses:
        '200':
          description: The file, with the `Content-Type` it was stored with.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown, unshared or deleted flight, or the pilot is not a member. All look the same.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /clubs/{clubId}/flights/{key}/track.json:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/Key'
    get:
      operationId: getClubTrackJson
      tags: [Clubs]
      summary: Fetch the parsed track of a club flight
      responses:
        '200':
          description: The parsed fixes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown, unshared or deleted flight, or the pilot is not a member. All look the same.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'The `token` from a sign in, sent as `Authorization: Bearer <token>`.'
  parameters:
    Collection:
      name: collection
      in: path
      required: true
      description: One of the collections the server stores per account.
      schema:
        enum: [flights, camera-paths, prefs]
    Id:
      name: id
      in: path
      required: true
      description: The item id, 1 to 200 characters. For `prefs` it is the pref key.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ClubId:
      name: clubId
      in: path
      required: true
      description: The id of a club from `GET /clubs`.
      schema:
        type: string
    Key:
      name: key
      in: path
      required: true
      description: The opaque `key` of a club flight, not the id of the owner's item.
      schema:
        type: string
    Since:
      name: since
      in: query
      description: The `cursor` of the previous page. Absent starts from the beginning.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size, 1 to `limits.maxPage`. Defaults to `limits.maxPage`.
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      description: The current item version in double quotes, as the `ETag` header shows it.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The value `*` creates the item and fails when it exists.
      schema:
        type: string
    IfNoneMatchRequired:
      name: If-None-Match
      in: header
      required: true
      description: Must be `*`.
      schema:
        const: '*'
  headers:
    ETag:
      description: The item version in double quotes.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the next try.
      schema:
        type: integer
  responses:
    Error:
      description: An error. The body has at least `message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The token is missing, wrong or expired. The client forgets the token and asks the pilot to sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The version does not match, or the item exists on create. The body is the current item.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    RateLimited:
      description: Too many requests. Servers may also send `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The server is busy. Try again later.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Session:
      description: Signed in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
  schemas:
    PasswordLogin:
      type: object
      description: The body of a password sign in.
      required: [identity, password]
      properties:
        identity:
          type: string
          description: The email of the account.
        password:
          type: string
      example:
        identity: pilot@example.org
        password: a-long-password
    SignUp:
      type: object
      description: The body of an account creation.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: At least 8 characters.
      example:
        email: pilot@example.org
        password: a-long-password
    Session:
      type: object
      description: The answer of a sign in. The token lifetime is the server's choice and there is no refresh.
      required: [token, user]
      properties:
        token:
          type: string
          description: Opaque. Sent as `Authorization Bearer` on every other route.
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
              description: A label for the account, such as the email.
      example:
        token: eyJhbGciOi...
        user:
          id: k3m9x2q7w1p5z8a
          name: pilot@example.org
    Error:
      type: object
      description: The body of every error answer. Extra fields are ignored and the app shows `message` as is.
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: true
      example:
        message: The version does not match.
    Capabilities:
      type: object
      description: What the server supports.
      required: [version, auth, clubs, limits]
      properties:
        version:
          const: 2
          description: Must be 2. The client refuses any other value.
        auth:
          type: object
          required: [password, signup, oauth]
          properties:
            password:
              type: boolean
              description: The client shows the email and password form.
            signup:
              type: boolean
              description: The client shows Create account next to the form. It also allows OAuth to create accounts.
            oauth:
              type: array
              description: Providers for the popup sign in, one sign in button per entry. An empty array when the server offers none.
              items:
                type: object
                required: [id, label]
                properties:
                  id:
                    type: string
                    description: Pass it as `{provider}` to `GET /auth/redirect/{provider}`.
                  label:
                    type: string
                    description: Display name for the sign in button.
        clubs:
          type: boolean
          description: True when the club routes work. Without it the app has no club.
        limits:
          type: object
          required: [maxPage, maxItemBytes, maxTrackBytes]
          properties:
            maxPage:
              type: integer
              description: Largest feed page. The client asks for at most this many.
            maxItemBytes:
              type: integer
              description: Largest body of an item write.
            maxTrackBytes:
              type: integer
              description: Largest body of a track upload. Bigger bodies answer 413.
      example:
        version: 2
        auth:
          password: true
          signup: false
          oauth:
            - id: github
              label: GitHub
        clubs: true
        limits:
          maxPage: 200
          maxItemBytes: 20000000
          maxTrackBytes: 50000000
    Item:
      type: object
      description: One stored record of a collection, or its tombstone.
      required: [id, version, deleted]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: Chosen by the client. 1 to 200 characters. For `prefs` it is the pref key.
        version:
          type: string
          description: Opaque. Changes on every write, also on a delete. It is the value of the `ETag` header without quotes.
        deleted:
          type: boolean
          description: True for a tombstone. A tombstone has no `data` and no `times`.
        data:
          type: object
          description: The record, opaque to the server, store it as is. Absent on a tombstone.
        times:
          $ref: '#/components/schemas/Times'
        secret:
          type: boolean
          description: Only on `prefs`. True when the value is a secret, such as an API key.
      example:
        id: 2026-07-14T10-02-11
        version: '42'
        deleted: false
        data:
          name: Bassano
          hasTrack: true
        times:
          name: 1784023331000
          hasTrack: 1784023331000
    Times:
      type: object
      description: Maps a top level field of `data` to the client clock in milliseconds when it last changed. Absent on a tombstone.
      additionalProperties:
        type: number
      example:
        name: 1784023331000
    ItemWrite:
      type: object
      description: The body of an item write.
      required: [data, times]
      properties:
        data:
          type: object
          description: The record. The server stores it as is.
        times:
          $ref: '#/components/schemas/Times'
        secret:
          type: boolean
          description: Only for `prefs`. Marks the item as a secret.
      example:
        data:
          name: Bassano
          hasTrack: true
        times:
          name: 1784023331000
          hasTrack: 1784023331000
    ItemPage:
      type: object
      description: One page of a collection feed.
      required: [items, cursor, more]
      properties:
        items:
          type: array
          description: The changed and the deleted items of the signed in account, in a stable server order.
          items:
            $ref: '#/components/schemas/Item'
        cursor:
          description: Opaque. Send it back as `since`. On an empty page it is the cursor that was sent, or null when none was.
          anyOf:
            - type: string
            - type: 'null'
        more:
          type: boolean
          description: True when the page was full, so there may be more items.
      example:
        items:
          - id: 2026-07-14T10-02-11
            version: '42'
            deleted: false
            data:
              name: Bassano
              hasTrack: true
            times:
              name: 1784023331000
              hasTrack: 1784023331000
          - id: 2026-06-30T09-15-40
            version: '43'
            deleted: true
        cursor: '43'
        more: false
    FlightData:
      type: object
      description: The fields of a `flights` item that the server reads. Every other field is opaque. Not enforced on write.
      properties:
        clubs:
          type: array
          description: Ids of the clubs the flight is shared with.
          items:
            type: string
        club:
          type: object
          description: 'Opaque summary shown in club feeds, for example `{ "km": 42.1 }`.'
        hasTrack:
          type: boolean
          description: False for a manual logbook flight without a track.
      example:
        clubs:
          - c8h2d1
        club:
          km: 42.1
        hasTrack: true
    TrackJson:
      type: object
      required: [fixes]
      description: The parsed fixes. The server never looks inside.
      properties:
        fixes:
          type: array
          items:
            type: object
            description: One GPS fix.
            properties:
              t:
                type: number
                description: Time in milliseconds.
              lat:
                type: number
                description: Latitude in degrees.
              lon:
                type: number
                description: Longitude in degrees.
              alt:
                type: number
                description: Altitude.
      example:
        fixes:
          - t: 1784023331000
            lat: 45.9
            lon: 11.7
            alt: 1320
          - t: 1784023332000
            lat: 45.9001
            lon: 11.7002
            alt: 1322
    ClubList:
      type: object
      description: The clubs of the signed in pilot.
      required: [clubs]
      properties:
        clubs:
          type: array
          items:
            $ref: '#/components/schemas/Club'
      example:
        clubs:
          - id: c8h2d1
            name: Bassano Flyers
    Club:
      type: object
      description: A club the signed in pilot belongs to.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
      example:
        id: c8h2d1
        name: Bassano Flyers
    ClubFlight:
      type: object
      description: A flight shared with a club. It carries a summary and never the flight data.
      required: [key, owner, mine, version, deleted, hasTrack]
      properties:
        key:
          type: string
          description: Opaque id for the track routes. It is not the id of the owner's item.
        owner:
          type: string
          description: Opaque account id. The app groups the flights of one pilot by it.
        mine:
          type: boolean
          description: True when the signed in account owns the flight.
        version:
          type: string
          description: Opaque. Changes whenever the entry changes.
        deleted:
          type: boolean
          description: True after an unshare, a delete or when the owner left the club.
        summary:
          description: The `club` field of the flight data, or null. Absent when deleted.
          anyOf:
            - type: object
            - type: 'null'
        hasTrack:
          type: boolean
          description: False for a manual flight without a track.
      example:
        key: r4t9k2
        owner: u7p3m1
        mine: false
        version: '57'
        deleted: false
        summary:
          km: 42.1
        hasTrack: true
    ClubFlightPage:
      type: object
      description: One page of a club feed.
      required: [items, cursor, more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClubFlight'
        cursor:
          description: Opaque. Send it back as `since`. On an empty page it is the cursor that was sent, or null when none was.
          anyOf:
            - type: string
            - type: 'null'
        more:
          type: boolean
          description: True when the page was full, so there may be more items.
      example:
        items:
          - key: r4t9k2
            owner: u7p3m1
            mine: false
            version: '57'
            deleted: false
            summary:
              km: 42.1
            hasTrack: true
        cursor: '57'
        more: false
